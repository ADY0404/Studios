{% extends 'base.html' %}
{% block title %}Reset Password — LinkStudio{% endblock %}
{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
  <div style="width: 100%; max-width: 420px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2>Forgot Password</h2>
      <p style="font-size: 0.875rem;">Enter your email to receive a password reset link.</p>
    </div>
    <div class="card">
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-input" required placeholder="name@example.com">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Instructions</button>
      </form>
    </div>
    <div style="text-align: center; margin-top: 1rem;">
      <a href="{% url 'accounts:login' %}" style="font-size: 0.8125rem; color: var(--accent-primary);">&larr; Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
