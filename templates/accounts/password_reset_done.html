{% extends 'base.html' %}
{% block title %}Instructions Sent — LinkStudio{% endblock %}
{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
  <div style="width: 100%; max-width: 420px; text-align: center;">
    <div class="card">
      <div style="font-size: 2.5rem; margin-bottom: 1rem;">✉️</div>
      <h2>Check Your Email</h2>
      <p style="font-size: 0.875rem; margin: 1rem 0;">We've emailed instructions for resetting your password if an account exists with the provided address.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-secondary btn-sm" style="width: 100%;">Return to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
