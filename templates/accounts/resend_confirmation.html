{% extends 'base.html' %}
{% load static %}

{% block title %}Resend Confirmation Email — LinkStudio{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex flex-column justify-content-center py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        
        <!-- Brand Logo -->
        <div class="text-center mb-4">
          <a class="d-inline-flex align-items-center gap-2 fw-bold text-dark text-decoration-none" href="{% url 'home' %}">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 p-2" style="width: 36px; height: 36px;">
              <i class="bi bi-link-45deg fs-4"></i>
            </div>
            <span class="fs-4">Link<span class="text-primary">Studio</span></span>
          </a>
          <h1 class="h5 fw-bold mt-3 mb-1">Resend Confirmation Link</h1>
          <p class="text-body-secondary small">Enter your email to receive a new activation link</p>
        </div>

        <!-- Form Card -->
        <div class="card border-0 shadow-sm rounded-4 p-3 p-sm-4 bg-white">
          <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
              <label class="form-label small fw-semibold">Account Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" name="email" class="form-control" value="{{ unconfirmed_email|default:'' }}" required autofocus placeholder="name@example.com">
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">Send Confirmation Email</button>
          </form>
        </div>

        <!-- Back to Login -->
        <div class="text-center mt-3 small">
          <a href="{% url 'accounts:login' %}" class="text-secondary text-decoration-none d-inline-flex align-items-center gap-1">
            <i class="bi bi-arrow-left"></i>
            <span>Back to Sign In</span>
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
