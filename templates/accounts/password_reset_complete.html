{% extends 'base.html' %}
{% block title %}Password Updated — LinkStudio{% endblock %}
{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
  <div style="width: 100%; max-width: 420px; text-align: center;">
    <div class="card">
      <div style="font-size: 2.5rem; margin-bottom: 1rem;">🎉</div>
      <h2>Password Reset Complete</h2>
      <p style="font-size: 0.875rem; margin: 1rem 0;">Your password has been set. You may now sign in with your new credentials.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-sm" style="width: 100%;">Sign In Now</a>
    </div>
  </div>
</div>
{% endblock %}
