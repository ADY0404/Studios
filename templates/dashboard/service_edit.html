{% extends 'dashboard_base.html' %}
{% load static %}

{% block page_title %}Edit Service{% endblock %}

{% block dashboard_content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="mb-3">
      <a href="{% url 'dashboard:bookings' %}" class="btn btn-sm btn-link text-body-secondary p-0 text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i> Back to bookings & services
      </a>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3 border-bottom">
        <h3 class="h6 mb-0 fw-bold">Edit Service: {{ service.title }}</h3>
        <span class="text-body-secondary small">Update price, duration, and instructions</span>
      </div>

      <div class="card-body p-4">
        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label small fw-semibold">Service Title</label>
            <input type="text" name="title" class="form-control" value="{{ form.title.value }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ form.description.value|default:'' }}</textarea>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label small fw-semibold">Duration (Minutes)</label>
              <input type="number" name="duration_minutes" class="form-control" value="{{ form.duration_minutes.value }}" min="5" step="5" required>
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold">Price (USD)</label>
              <input type="number" name="price" class="form-control" value="{{ form.price.value }}" min="0" step="0.01" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Instructions for Client</label>
            <textarea name="instructions" class="form-control" rows="2">{{ form.instructions.value|default:'' }}</textarea>
          </div>

          <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" name="is_active" id="srv_edit_active" {% if form.is_active.value %}checked{% endif %}>
            <label class="form-check-label small" for="srv_edit_active">Service is active and bookable</label>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'dashboard:bookings' %}" class="btn btn-sm btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-sm btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
